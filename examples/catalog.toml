# Machine-readable catalogue of the CLI examples (parity key: id).
# linux = bash script, windows = PowerShell script (Windows PowerShell 5.1 and PowerShell 7),
# both relative to this directory. Every file listed here is run by a tested block of
# docs/linux (scripts/test-docs.py) or docs/windows (scripts/test-docs.ps1), and by
# scripts/test-examples.sh / scripts/test-examples.ps1. language_specific = true marks an
# example that exists for one OS only.

[[example]]
id = "pick-git-branch"
title = "Pick a Git branch"
summary = "Switch to a branch chosen from a table of recent branches with their last commit."
teaches = ["JSON rows built from tab-separated tool output", "single choice", "reading a field of the chosen record"]
linux = "pick-git-branch.sh"
windows = "pick-git-branch.ps1"
run_linux = "./pick-git-branch.sh [REPOSITORY]"
run_windows = ".\\pick-git-branch.ps1 [-Repository PATH]"
guide = "recipes/git-branch"
language_specific = false

[[example]]
id = "delete-files"
title = "Delete files with confirmation"
summary = "Tick files, confirm in a second window, then delete exactly the ticked files."
teaches = ["NUL-safe or literal paths", "a confirmation select", "nothing changes unless submitted"]
linux = "delete-files.sh"
windows = "delete-files.ps1"
run_linux = "./delete-files.sh DIRECTORY [GLOB]"
run_windows = ".\\delete-files.ps1 -Path DIRECTORY [-Filter GLOB] [-WhatIf]"
guide = "recipes/delete-files"
language_specific = false

