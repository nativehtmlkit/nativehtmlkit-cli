apiVersion: nativehtmlkit.cli/v1
status: proposed
binary: nhk
longAlias: nativehtmlkit
platforms:
  - linux-x86_64-wayland
  - windows-x86_64-interactive
stdoutPolicy:
  interactiveCommands: data-only-on-submit
  viewAndConfirm: empty
  cancellation: empty
  errors: empty-before-commit
  diagnostics: stderr
  note: post-commit-broken-pipe-may-have-partial-bytes
exitCodes:
  0: submitted-or-normal-readonly-close
  2: bad-usage
  3: desktop-unavailable
  4: runtime-host-or-protocol-failure
  5: input-invalid-or-over-limit
  6: stdout-write-failure
  10: user-cancel
  124: timeout-future
  130: interrupted
commands:
  select:
    stage: P1-lines-P2-structured
    stdin: snapshot-until-eof
    stdout: chosen-records-only
    flags:
      multi: {type: boolean, default: false}
      title: {type: string, default: Select items}
      input: {type: enum, values: [lines, csv, tsv, json, ndjson], default: lines}
      output: {type: enum, values: [same, lines, json, ndjson, csv, tsv, values, result-json], default: same}
      file: {type: filepath, required: false}
      columns: {type: csv-field-names, required: false}
      value-field: {type: field-name, required: false}
      min: {type: unsigned-integer, default: 1}
      max: {type: unsigned-integer, required: false}
      allow-empty: {type: boolean, default: false}
      search: {type: string, required: false}
      theme: {type: enum, values: [system, dark, light], default: system}
  view:
    stage: P2
    stdin: snapshot-until-eof
    stdout: none
    flags:
      title: {type: string, default: View output}
      input: {type: enum, values: [text, json, ndjson, csv, tsv], default: text}
      file: {type: filepath, required: false}
  input:
    stage: P3
    stdin: none-unless-explicit
    stdout: entered-string
    flags:
      label: {type: string, required: true}
      default: {type: string, required: false}
      required: {type: boolean, default: false}
      title: {type: string, default: Enter value}
  confirm:
    stage: P3
    stdin: none
    stdout: none
    flags:
      message: {type: string, required: true}
      title: {type: string, default: Confirm}
  form:
    stage: P3-spec-P4-html
    stdin: none-unless-explicit
    stdout: typed-json-object
    flags:
      spec: {type: filepath, required: false}
      html: {type: filepath, required: false}
      css: {type: filepath, required: false}
      output: {type: enum, values: [json, result-json], default: json}
  doctor:
    stage: P0
    stdin: none
    stdout: human-readable-or-json
    flags:
      json: {type: boolean, default: false}
inputLimitsP1:
  bytes: 4194304
  rows: 2000
  columns: 24
  recordBytes: 65536
  pageRows: 50
  displayedCellMaxUtf8Bytes: 512
coreHostConstraints:
  maxDocumentHtmlBytes: 1048576
  maxFramedRpcBytes: 2097152
  maxBatchOperations: 1024
