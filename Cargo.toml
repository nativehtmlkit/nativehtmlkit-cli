[package]
name = "nativehtmlkit-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/nativehtmlkit/nativehtmlkit-cli"
description = "Native HTML/CSS GUI views and interactive selection in command pipelines"
publish = false

[[bin]]
name = "nativehtmlkit"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
csv = "1"
tempfile = "3"
ctrlc = "3.4"
toml = "0.8"



[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects"] }
